name: probe entropy
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://omni-client-api.prod.ap-northeast-1.variational.io/metadata/stats https://omni-client-api.prod.ap-northeast-1.variational.io/metadata/supported_assets; do
            echo "== $u"; curl -s -m 30 "$u" -o out.json -w "HTTP %{http_code}\n"; head -c 300 out.json; echo
            python3 - <<'PY'
          import json
          try:
              d = json.load(open("out.json"))
          except Exception as e:
              print("::notice::notjson " + str(e)); raise SystemExit
          def note(t):
              for i in range(0, len(t), 3500): print("::notice::" + t[i:i+3500])
          if isinstance(d, dict) and "listings" in d:
              L = d["listings"]
              note("TICKERS %d " % len(L) + json.dumps(sorted(x.get("ticker") for x in L)))
              note("SAMPLE " + json.dumps(L[0])[:3000])
              stocks = [x for x in L if x.get("ticker") in ("NVDA","TSLA","AAPL","OPENAI","SNDK","GOOGL","META","AMZN","MSFT","COIN","PLTR","AAOI")]
              for x in stocks[:3]: note("STOCK " + json.dumps(x)[:2000])
              note("KEYS " + json.dumps(list(d.keys())))
          else:
              note("OTHER " + json.dumps(d)[:3000])
          PY
          done
